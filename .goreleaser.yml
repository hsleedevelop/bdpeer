version: 2

project_name: bdpeer

before:
  hooks:
    - go mod tidy

builds:
  # darwin: CGO required for CoreBluetooth BLE.
  # post hook ad-hoc codesigns the binary so macOS TCC reads the embedded
  # Info.plist (NSBluetoothAlwaysUsageDescription) — without a code identity
  # CoreBluetooth aborts the process on first use.
  - id: bdpeer-darwin
    main: ./cmd/bdpeer
    binary: bdpeer
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    hooks:
      post:
        - cmd: codesign --force --sign - --timestamp=none --options runtime --entitlements internal/discovery/entitlements.plist "{{ .Path }}"

  # linux + windows: tinygo BLE scan via pure Go (no CGO needed)
  - id: bdpeer-other
    main: ./cmd/bdpeer
    binary: bdpeer
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - ids:
      - bdpeer-darwin
      - bdpeer-other
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: hsleedevelop
    name: bdpeer
  draft: false
  prerelease: auto
